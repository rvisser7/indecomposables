# The database schema: the single source of truth for what is stored.
#
# Each column needs a `type` and a `short_doc`; `long_doc` is optional prose
# for data/README.md. `files` determines which files this column is included in the output.
# Could be either mini and/or full.
#
# `type` is logical: the element type plus how deeply it is nested, e.g.
# `numeric[][]` for a 2-D array of numbers.  Add `jagged: true` when the nesting
# is ragged -- the classes hold different numbers of elements, say.  That is the
# one thing that cannot be derived, and it decides the storage: Postgres array
# literals must be rectangular, so a jagged column is written as jsonb while a
# rectangular one keeps its array type.  schema.py handles the mapping.
#
# Column order here is the column order in the data files.


# ---------------------------------------
# LMFDB invariants of the field K itself
# ---------------------------------------

lmfdb_label:
  type: text
  files: [mini, full]
  short_doc: 'LMFDB label of the totally real field K'
  long_doc: >-
      The label of K in the LMFDB, of the form n.n.|disc|.i since K is totally real. It determines the defining polynomial, and hence the ordering of the real embeddings and the integral basis that every coefficient vector here refers to.

degree:
  type: smallint
  files: [full]
  short_doc: 'degree n of K'

discriminant:
  type: numeric
  files: [mini, full]
  short_doc: 'discriminant of K'

coeffs:
  type: numeric[]
  files: [mini, full]
  short_doc: 'coefficients of the LMFDB polredabs defining polynomial, constant term first'

regulator:
  type: double precision
  files: [mini, full]
  short_doc: 'regulator of K'

class_number:
  type: integer
  files: [mini, full]
  short_doc: 'class number h of K'

narrow_class_number:
  type: integer
  files: [mini, full]
  short_doc: 'narrow class number h+ of K'
  long_doc: >-
    Satisfies h+/h = num_signature_classes = 2^(n-r), which is a useful consistency check across three independently computed columns.

is_monogenic:
  type: smallint
  files: [mini, full]
  short_doc: '1 if monogenic, -1 if not, 0 if unknown'

monogenic_index:
  type: numeric
  files: [mini, full]
  short_doc: 'index [O_K : Z[a]] of the power order'

num_subfields:
  type: smallint
  files: [mini, full]
  short_doc: 'number of subfields, excluding Q and K'

is_galois:
  type: smallint
  files: [mini, full]
  short_doc: 'whether K/Q is Galois'

galois_label:
  type: text
  files: [mini, full]
  short_doc: 'LMFDB label nTt of the Galois group'

# ---------------------------------------------------
# Unit information and signature classes information
# ---------------------------------------------------

fundamental_units:
  type: numeric[][]
  files: [mini, full]
  short_doc: 'fundamental units as coefficient vectors'

positive_unit_basis:
  type: numeric[][]
  files: [mini, full]
  short_doc: 'Z-basis of the totally positive units as coefficient vectors'

unit_signature_rank:
  type: smallint
  files: [mini, full]
  short_doc: 'rank r over F_2 of the signature map on the unit group'

signature_classes:
  type: smallint[][]
  files: [mini, full]
  short_doc: 'canonical representatives of the signature classes as +-1 vectors; defines the index order of every _by_signature column, with index 0 the totally positive class'
  long_doc: >-
    Canonical representatives are the numerically smallest bitmask in each coset, listed ascending, so index 0 is always the totally positive class and every representative begins with +. The embeddings sigma_1 ... sigma_n are ordered by increasing sigma_i(a), where a is the root of the LMFDB defining polynomial.



num_signature_classes:
  type: smallint
  files: [mini, full]
  short_doc: 'number of signature classes, equal to 2^(n-r) and to h+/h'
  long_doc: >-
      Multiplication by a unit maps elements of signature sigma to signature sigma.sig(u), so sails and minimal elements depend only on the coset of sigma modulo Sig(U). This counts those cosets.

totally_positive_unit_index:
  type: integer
  files: [mini, full]
  short_doc: 'index [U : U^+]'
  long_doc: "The index of the totall positive units U^+ inside the full unit group U"

# --------------------------
# INDECOMPOSABLES INFO !
# --------------------------

# technically don't need this, as this is just num_indecomposables_all[0]
num_indecomposables_tp:
    type: integer
    files: []
    short_doc: 'number of indecomposables up to multiplication by totally positive units.'
    long_doc: "Number of totally positive indecomposables, up to multiplication by U^+.  This is the same as num_indecomposables_all[0]"

num_indecomposables_all:
    type: integer[]
    files: [mini, full]
    short_doc: 'number of s-indecomposables in each signature s, up to multiplication by totally positive units'

indecomposables_all:
  type: numeric[][][]
  jagged: true
  files: [full]
  short_doc: 'the s-indecomposables of each signature class, in canonical form, as coefficient vectors; jagged, so JSON rather than a Postgres array'
  long_doc: >-
    x in the signature class S_s is s-indecomposable if it is not a sum of two elements of S_s. Each S_s is the lattice intersected with an open orthant, hence closed under addition, so this is the same notion in every class; for s totally positive it is ordinary indecomposability. Equivalently, no y in S_s has |sigma_i(y)| < |sigma_i(x)| for all i, which is the form the computation uses.

# probably don't need this, as its just indecomposables_all[0]
indecomposables_tp:
  type: numeric[][]
  files: []
  short_doc: 'the totally positive class of indecomposables_all; duplicated here because it is what most users want'

indecomposables_norms_all:
  type: numeric[][]
  jagged: true
  files: [full]
  short_doc: 'absolute norms of indecomposables_all, same order'

indecomposables_traces_all:
  type: numeric[][]
  jagged: true
  files: [full]
  short_doc: 'traces of indecomposables_all, same order'

# Here we can exclude units in all signatures (as units are always indecomposable)
min_norm_indecomposable:
  type: numeric[]
  files: [mini, full]
  short_doc: 'smallest norm of a non-unit s-indecomposable, NULL if there is none'
  long_doc: >-
      NULL when the only indecomposables are units, which happens for instance for Q(sqrt 5).

max_norm_indecomposable:
  type: numeric[]
  files: [mini, full]
  short_doc: 'largest norm of an s-indecomposable'
  long_doc: >-
      Bounded above by |disc| in general (Kala-Yatsyna), and by disc/4 in degree 2 (Dress-Scharlau).

min_trace_indecomposable:
  type: numeric[]
  files: [mini, full]
  short_doc: 'smallest trace of an s-indecomposable among the canonical representatives'

max_trace_indecomposable:
  type: numeric[]
  files: [mini, full]
  short_doc: 'largest trace of an s-indecomposable among the canonical representatives'

min_norm_decomposable:
  type: numeric[]
  files: [mini, full]
  short_doc: 'smallest norm of an s-decomposable in O^s not lying in m O^s for some m >= 2'

min_norm_all_signatures:
  type: numeric
  files: [mini, full]
  short_doc: 'least k such that every signature class contains an element of absolute norm <= k'

min_norm_fprimea_signature:
  type: numeric
  files: [mini, full]
  short_doc: 'smallest absolute norm in the signature class containing f''(a)'

codifferent_traces:
  type: numeric[]
  files: [full]
  short_doc: 'for each indecomposable, the least Tr(lambda alpha) over totally positive lambda in the codifferent'
  long_doc: >-
      Equals 1 exactly when alpha lies on the sail, so this is a graded refinement of indecomposables_on_sail. Known to be 1 throughout for real quadratic fields and at most 2 for simplest cubics, and Kala-Tinkova show it can be arbitrarily large in other families; its distribution is not known.

max_codifferent_trace:
  type: smallint
  files: [mini, full]
  short_doc: 'largest entry of codifferent_traces'
  long_doc: >-
      Equal to 1 exactly when every indecomposable lies on the sail, so it is a scalar version of num_on_sail == num_indecomposables_tp that can be filtered on directly.

# probably don't need this?
num_indecomposables_total:
  type: integer
  files: []
  short_doc: 'total number of s-indecomposables summed over all signature classes'

# ---------------------------------
# SAIL DATABASE !
# --------------------------------

num_indecomposables_on_sail:
  type: integer[]
  files: [mini, full]
  short_doc: 'how many of the s-indecomposables lie on the s-sail; equals num_indecomposables_all when n = 2'
  long_doc: >-
    Every lattice point on the sail is indecomposable, but for degree at least 3 the converse fails, so this can be strictly smaller than num_indecomposables_tp. The size of the gap is one of the things this database is for.

num_sail_facets:
  type: integer[]
  files: [mini, full]
  short_doc: 'facets of the totally positive sail'

indecomposables_on_sail:
  type: smallint[][]
  jagged: true
  files: [full]
  short_doc: '0/1 flags, same order, for whether each lies on the sail'

sail_facet_normals:
  type: numeric[][][]
  jagged: true
  files: [full]
  short_doc: 'per signature class, the facet normals lambda in the codifferent as coefficient vectors; each facet is the hyperplane Tr(lambda x) = 1'
  long_doc: >-
      Each facet of the sail is the hyperplane Tr(lambda x) = 1 for a totally positive lambda in the codifferent. Such a lambda proves every element on that facet indecomposable, since Tr(lambda beta) >= 1 for all totally positive beta.

sail_facet_vertices:
  type: integer[][][]
  jagged: true
  files: [full]
  short_doc: 'per signature class, per facet, indices into indecomposables_all of that class; indices rather than coordinates so the two cannot disagree'

num_sail_facets_by_signature:
  type: integer[]
  files: [full]
  short_doc: 'facet count per signature class'

num_sail_vertices:
  type: integer[]
  files: []
  short_doc: 'extreme points of the sail, as opposed to all lattice points on it'
  long_doc: >-
      In degree 2 this is the distinction between convergents and semiconvergents. Derivable from sail_facet_vertices, but stored so it can be queried without reading the array.

# ------------------------------------------------------------
# Miscellenaous stuff (not sure if we're including this?)
# ----------------------------------------------------------

# technically, dont need this, as we're already storing "signture_classes"
signature_masks:
  type: smallint[]
  files: []
  short_doc: 'the same classes as bitmasks (+ -> 0, - -> 1, sigma_1 most significant), ascending'

family:
  type: text
  files: []
  short_doc: 'recognised family, e.g. simplest_cubic or biquadratic; NULL otherwise'

family_parameter:
  type: numeric
  files: []
  short_doc: 'the family''s parameter, when scalar'

all_signatures_complete:
  type: smallint
  files: []
  short_doc: 'whether every signature class finished and certified'

sail_complete:
  type: smallint
  files: []
  short_doc: 'whether the completeness certificate passed for the totally positive sail'
  long_doc: >-
    Set when every codimension-2 face of every facet is paired with another, which certifies that the facets tile a closed surface modulo units rather than that the search merely stopped.

sail_complete_by_signature:
  type: smallint[]
  files: []
  short_doc: '0/1 completeness certificate per signature class'
