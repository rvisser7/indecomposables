[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indecomposables"
version = "0.1.0"
description = "Indecomposable integers and sails of totally real number fields"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Sage is not installable from PyPI; it comes from environment.yml.  Everything
# listed here is importable without it, which is what lets the fast CI tier run
# on plain Python.
dependencies = ["pyyaml>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist", "pytest-timeout", "pytest-instafail", "flake8"]

[project.scripts]
indec-merge     = "scripts.merge_shards:main"
indec-validate  = "scripts.validate_data:main"
indec-remaining = "scripts.remaining_work:main"

[tool.setuptools]
packages = ["indecomposables", "indecomposables.families"]

# schema.yaml is read at import time, so it must travel with the installed
# package, not just live in the repo.
[tool.setuptools.package-data]
indecomposables = ["schema.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -v          one line per test with its name, instead of a dot
# --tb=short  a readable frame plus the assertion, not a full stack
# -ra         end-of-run summary listing every failure, error and skip reason
# -l          show local variables in the failing frame, which for these tests
#             means the field and element that actually broke
addopts = "--strict-markers -v --tb=short -ra -l -m 'not slow and not verification'"
markers = [
    "sage: requires Sage",
    "slow: minutes per test",
    "verification: cross-algorithm agreement runs, hours",
    "dress_scharlau: real quadratic classification",
    "kala_tinkova: simplest cubic classification",
    "biquadratic: Man's biquadratic classification",
    "sail: sail computation",
    "comparison: specialised algorithm against brute force",
]
